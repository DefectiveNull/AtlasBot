[project]
name = "discord-agent"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "discord-py>=2.6.4,<3",
    "openai>=2.8.1,<3",
    "aiohttp>=3.13.2,<4",
    "pypdf>=6,<7",
    "youtube-transcript-api>=1.2,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=9.0.1,<10", "pytest-asyncio>=1.3.0,<2", "ruff>=0.14.5,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
